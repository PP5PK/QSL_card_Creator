# Apache HTTPS virtual host (created by certbot, then edited to proxy to the app).
# Replace qsl.domain.net with your domain. See README.md > Production deployment.
<IfModule mod_ssl.c>
<VirtualHost *:443>
     ServerName qsl.domain.net

     ProxyPreserveHost On
     ProxyPass / http://127.0.0.1:3000/
     ProxyPassReverse / http://127.0.0.1:3000/

     SSLCertificateFile /etc/letsencrypt/live/qsl.domain.net/fullchain.pem
     SSLCertificateKeyFile /etc/letsencrypt/live/qsl.domain.net/privkey.pem
     Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>

# Apache HTTP virtual host: redirects everything to HTTPS.
# Replace qsl.domain.net with your domain. See README.md > Production deployment.
<VirtualHost *:80>
     ServerName qsl.domain.net
     DocumentRoot /var/www/html/cards
RewriteEngine on
RewriteCond %{SERVER_NAME} =qsl.domain.net
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
